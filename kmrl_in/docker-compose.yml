version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kmrl_postgres
    environment:
      POSTGRES_DB: kmrl_db
      POSTGRES_USER: kmrl_user
      POSTGRES_PASSWORD: kmrl_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: kmrl_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: kmrl_user
      RABBITMQ_DEFAULT_PASS: kmrl_password

  redis:
    image: redis:7-alpine
    container_name: kmrl_redis
    ports:
      - "6379:6379"

  load_balancer_api:
    build: .
    container_name: kmrl_load_balancer_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://kmrl_user:kmrl_password@postgres:5432/kmrl_db
      - CELERY_BROKER_URL=amqp://kmrl_user:kmrl_password@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - postgres
      - rabbitmq
      - redis

  celery_worker_1:
    build: .
    container_name: kmrl_worker_1
    command: celery -A workers.celery_app worker --loglevel=info -n worker1@%h
    environment:
      - DATABASE_URL=postgresql://kmrl_user:kmrl_password@postgres:5432/kmrl_db
      - CELERY_BROKER_URL=amqp://kmrl_user:kmrl_password@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - rabbitmq
      - redis

  dashboard:
    build: .
    container_name: kmrl_dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - load_balancer_api

volumes:
  postgres_data:
